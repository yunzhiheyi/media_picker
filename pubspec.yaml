name: media_picker
description: >
  Flutter media picker with image/video Hero preview, plus reusable image and
  video compression APIs. Chat-oriented presets are included but optional.
version: 1.0.0
homepage: https://github.com/yunzhiheyi/media_picker
repository: https://github.com/yunzhiheyi/media_picker
issue_tracker: https://github.com/yunzhiheyi/media_picker/issues
publish_to: none

environment:
  sdk: ^3.7.2
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  path_provider: ^2.1.5
  path: ^1.9.1
  photo_manager: ^3.8.3
  file_picker: ^10.3.10
  flutter_image_compress: ^2.4.0
  # Native Android Media3 / iOS AVFoundation compressor.  It deliberately
  # avoids FFmpeg binaries and provides a real-time progress callback.
  v_video_compressor: ^2.0.0
  hero_media_viewer:
    git:
      url: https://github.com/yunzhiheyi/hero_media_viewer.git
      ref: d5ce1daaec9da706ecf83adfa72af4eea4940481

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.brighton.media_compressor
        pluginClass: MediaCompressorPlugin
      ios:
        pluginClass: MediaCompressorPlugin
