name: media_compressor
description: >
  Flutter plugin for image/video compression and album media picking.
  Extracted for reuse from yunzhiheyi/video_compressor; targets chat SDK presets
  (720p / ~1.5Mbps video, long-edge 2048 image + 512 thumb).
version: 1.1.0
homepage: https://github.com/yunzhiheyi/media_compressor
repository: https://github.com/yunzhiheyi/media_compressor
issue_tracker: https://github.com/yunzhiheyi/media_compressor/issues

environment:
  sdk: ^3.7.2
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  path_provider: ^2.1.5
  path: ^1.9.1
  photo_manager: ^3.8.3
  file_picker: ^10.3.10
  flutter_image_compress: ^2.4.0
  ffmpeg_kit_flutter_new_min: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.brighton.media_compressor
        pluginClass: MediaCompressorPlugin
      ios:
        pluginClass: MediaCompressorPlugin
